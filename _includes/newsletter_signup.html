<section id="newsletter-signup" class="flex items-center py-20 px-4">
  <div class="max-w-3xl mx-auto w-full">
    <div class="bg-card rounded-2xl py-10 px-8 md:py-12 md:px-14 text-center text-white">
      <h2 class="h2 font-bold text-white mb-3">Subscribe to newsletter</h2>
      <p class="h5 text-gray font-normal mb-8 max-w-xl mx-auto">
        Get updates on technical info, real use cases, and product features.
      </p>
      <form id="newsletterSignupForm" class="relative text-left max-w-md mx-auto text-white space-y-6" novalidate>
        <div>
          <label for="newsletterName" class="block h5 font-bold text-gray mb-1">Name</label>
          <input
            id="newsletterName"
            type="text"
            autocomplete="name"
            class="w-full fillform-black px-4 py-2 rounded-checkoutform border-1 btn-border-gray"
          />
        </div>
        <div>
          <label for="newsletterEmail" class="block h5 font-bold text-gray mb-1">Email</label>
          <input
            id="newsletterEmail"
            type="email"
            autocomplete="email"
            required
            class="w-full fillform-black border-1 btn-border-gray px-4 py-2 rounded-checkoutform"
            aria-describedby="newsletterEmailError"
          />
          <p id="newsletterEmailError" class="text-red-400 text-sm mt-1" hidden>Please enter a valid email address.</p>
        </div>
        <!-- Honeypot: leave empty. Bots that fill it are rejected server-side. -->
        <div class="absolute -left-[9999px] top-auto h-px w-px overflow-hidden" aria-hidden="true">
          <label for="newsletterWebsite">Website</label>
          <input
            id="newsletterWebsite"
            type="text"
            name="website"
            tabindex="-1"
            autocomplete="off"
          />
        </div>
        <label class="flex items-start gap-2 cursor-pointer">
          <input id="newsletterConsent" type="checkbox" required class="mt-1" />
          <span class="h6 text-gray font-normal">
            I agree to receive marketing emails from Kommu. See our
            <a href="{{ '/privacy' | relative_url }}" class="underline text-white">Privacy Policy</a>.
          </span>
        </label>
        <div class="text-center">
          <button type="submit" id="newsletterSubmitBtn" class="h5 inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full">
            Subscribe
          </button>
        </div>
        <p id="newsletterSuccess" class="text-green-400 text-sm mt-4 text-center" hidden>You’re subscribed — check your inbox soon.</p>
        <p id="newsletterError" class="text-red-400 text-sm mt-4 text-center" hidden>Something went wrong. Please try again or email support@kommu.ai.</p>
      </form>
    </div>
  </div>
</section>

<script>
(function () {
  {% if site.newsletter_api_url and site.newsletter_api_url != "" %}
  const SUBSCRIBE_URL = {{ site.newsletter_api_url | jsonify }};
  {% else %}
  const SUBSCRIBE_URL = 'https://aws.kommu.ai/newsletter/subscribe';
  {% endif %}
  const form = document.getElementById('newsletterSignupForm');
  if (!form) return;

  const emailEl = document.getElementById('newsletterEmail');
  const nameEl = document.getElementById('newsletterName');
  const websiteEl = document.getElementById('newsletterWebsite');
  const consentEl = document.getElementById('newsletterConsent');
  const submitBtn = document.getElementById('newsletterSubmitBtn');
  const emailError = document.getElementById('newsletterEmailError');
  const successEl = document.getElementById('newsletterSuccess');
  const errorEl = document.getElementById('newsletterError');
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    successEl.hidden = true;
    errorEl.hidden = true;
    emailError.hidden = true;

    const email = emailEl.value.trim().toLowerCase();
    const name = nameEl.value.trim();
    const website = websiteEl ? websiteEl.value.trim() : '';

    // Honeypot filled → fake success, do not call API
    if (website) {
      form.reset();
      successEl.textContent = 'You’re subscribed — check your inbox soon.';
      successEl.hidden = false;
      return;
    }

    if (!emailRegex.test(email)) {
      emailError.hidden = false;
      emailEl.focus();
      return;
    }
    if (!consentEl.checked) {
      errorEl.textContent = 'Please agree to receive marketing emails.';
      errorEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Subscribing…';

    try {
      const isAppsScript = SUBSCRIBE_URL.indexOf('script.google.com') !== -1;
      const res = await fetch(SUBSCRIBE_URL, {
        method: 'POST',
        headers: isAppsScript
          ? { 'Content-Type': 'text/plain;charset=utf-8' }
          : { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          name: name || '',
          source: 'homepage',
          website: ''
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || 'Subscribe failed');
      }
      form.reset();
      if (data.created === false) {
        successEl.textContent = 'You’re already subscribed — thanks!';
      } else {
        successEl.textContent = 'You’re subscribed — check your inbox soon.';
      }
      successEl.hidden = false;
    } catch (err) {
      console.error('Newsletter subscribe failed', err);
      var msg = (err && err.message) ? String(err.message) : '';
      if (/failed to fetch|networkerror|load failed/i.test(msg)) {
        errorEl.textContent = 'Could not reach the subscribe service. If you are on a restricted network, try another connection or contact support@kommu.ai.';
      } else if (msg && msg !== 'Subscribe failed') {
        errorEl.textContent = msg;
      } else {
        errorEl.textContent = 'Something went wrong. Please try again or email support@kommu.ai.';
      }
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Subscribe';
    }
  });
})();
</script>
